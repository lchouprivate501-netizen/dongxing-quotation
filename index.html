<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>東興傢俱裝潢社 估價單</title>
<style>
  @page { size: A4; margin: 10mm; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", sans-serif;
    background: #f0f0f0;
    padding: 20px;
    font-size: 12px;
  }
  .sheet {
    width: 210mm;
    min-height: 297mm;
    margin: 0 auto;
    background: white;
    padding: 8mm 10mm;
    box-shadow: 0 0 10px rgba(0,0,0,0.2);
  }
  .header-title {
    text-align: center;
    font-size: 20px;
    font-weight: bold;
    letter-spacing: 5px;
    padding: 3px 0;
  }
  .header-subtitle {
    text-align: center;
    font-size: 18px;
    font-weight: bold;
    letter-spacing: 10px;
    border-bottom: 2px solid #000;
    padding: 1px 0 3px 0;
  }
  .info-table {
    width: 100%;
    border-collapse: collapse;
    border: 1.5px solid #000;
    border-bottom: none;
  }
  .info-table td {
    border: 1px solid #000;
    padding: 3px 6px;
    font-size: 12px;
    vertical-align: top;
  }
  .project-cell {
    width: 58%;
    min-height: 90px;
    border-right: 1.5px solid #000 !important;
    text-align: left;
    padding: 38px 12px 8px 12px !important;
  }
  .project-cell .label { display: inline; margin-right: 6px; font-size: 13px; }
  .project-cell input {
    text-align: left; width: 68% !important; font-size: 13px;
    display: inline-block; border-bottom: 1px solid #000;
  }
  .contact-cell { width: 42%; font-size: 11.5px; line-height: 1.5; padding: 2px 6px !important; }
  .contact-cell div { border-bottom: 1px solid #000; padding: 3px 0; height: 20px; line-height: 20px; }
  .contact-cell div:last-child { border-bottom: none; }
  .date-row {
    display: flex; align-items: center; justify-content: space-between;
    border: 1.5px solid #000; border-top: none; border-bottom: none;
    padding: 4px 12px; font-size: 13px; height: 30px; white-space: nowrap;
  }
  .date-row input.editable {
    width: 40px !important; border: none !important; text-align: center;
    font-size: 13px; background: transparent; margin: 0 6px;
  }
  table.quotation {
    width: 100%; border-collapse: collapse; border: 2px solid #000; table-layout: fixed;
  }
  table.quotation th, table.quotation td {
    border: 1px solid #000; padding: 1px 2px; text-align: center;
    height: 20px; font-size: 11.5px; vertical-align: middle;
  }
  table.quotation th { background: #f8f8f8; font-weight: bold; text-align: center !important; }
  .col-item { width: 6%; }
  .col-spec { width: 34%; }
  .col-spec input { text-align: left !important; padding-left: 4px; }
  .col-qty { width: 7%; }
  .col-unit { width: 6%; }
  .col-price { width: 11%; }
  .col-amount { width: 13%; }
  .col-note { width: 23%; }
  .subtotal-row td { font-weight: bold; }
  .total-words {
    border: 2px solid #000; border-top: none; padding: 4px 8px;
    font-size: 13px; display: flex; justify-content: space-between;
  }
  .footer-notes {
    border: 2px solid #000; border-top: none; padding: 6px 8px;
    font-size: 11px; display: flex; justify-content: space-between;
  }
  .footer-notes .left { flex: 1; }
  .footer-notes .right { width: 180px; text-align: right; }
  input.editable {
    width: 100%; border: none; background: transparent;
    font-size: inherit; font-family: inherit; text-align: inherit; padding: 0 2px;
  }
  input.editable:focus { outline: 1px solid #4a90e2; background: #fffef0; }
  .controls { max-width: 210mm; margin: 15px auto; text-align: center; }
  button {
    padding: 8px 20px; margin: 0 6px; font-size: 14px; cursor: pointer;
    background: #1a73e8; color: white; border: none; border-radius: 4px;
  }
  button.secondary { background: #34a853; }
  button.add { background: #f39c12; }
  @media (max-width: 768px) {
    body { padding: 8px; font-size: 11px; }
    .sheet { width: 100%; min-height: auto; padding: 6mm 4mm; box-shadow: none; }
    .header-title { font-size: 18px; }
    .header-subtitle { font-size: 16px; }
    .project-cell { padding: 20px 6px !important; min-height: 70px; }
    .date-row { flex-wrap: wrap; height: auto; justify-content: flex-start; }
    table.quotation th, table.quotation td { font-size: 10px; height: 18px; }
    button { padding: 10px 16px; font-size: 13px; margin: 4px; }
  }
  @media print {
    body { background: white; padding: 0; }
    .controls { display: none !important; }
    .sheet { box-shadow: none; padding: 0; margin: 0; width: 100%; }
  }
</style>
</head>
<body>

<div class="controls">
  <button class="add" onclick="addRow()">＋ 增添新項目</button>
  <button class="secondary" onclick="window.print()">輸出 / 列印估價單</button>
  <button onclick="downloadPDF()">下載 PDF</button>
</div>

<div class="sheet" id="sheet">
  <div class="header-title">東 興 傢 俱 裝 潢 社</div>
  <div class="header-subtitle">估　價　單</div>

  <table class="info-table">
    <tr>
      <td class="project-cell">
        <span class="label">工程名稱：</span>
        <input class="editable" id="projectName">
      </td>
      <td class="contact-cell">
        <div>地址：中壢區中山東路一段232號之2</div>
        <div>電話：03-4362399</div>
        <div>傳真：03-4362348</div>
        <div>統編：45033239</div>
        <div>行動電話：0976-141-934</div>
      </td>
    </tr>
  </table>

  <div class="date-row">
    <span>中華民國</span>
    <input class="editable" id="year">
    <span>年</span>
    <input class="editable" id="month">
    <span>月</span>
    <input class="editable" id="day">
    <span>日</span>
  </div>

  <table class="quotation" id="quotationTable">
    <thead>
      <tr>
        <th class="col-item">項目</th>
        <th class="col-spec">規格</th>
        <th class="col-qty">數量</th>
        <th class="col-unit">單位</th>
        <th class="col-price">單價</th>
        <th class="col-amount">金額</th>
        <th class="col-note">備註</th>
      </tr>
    </thead>
    <tbody id="itemsBody"></tbody>
    <tr class="subtotal-row">
      <td><input class="editable"></td>
      <td><input class="editable"></td>
      <td><input class="editable"></td>
      <td colspan="2" style="text-align:right; padding-right:8px;">小計</td>
      <td id="subtotal">0</td>
      <td></td>
    </tr>
    <tr class="subtotal-row">
      <td><input class="editable"></td>
      <td><input class="editable"></td>
      <td><input class="editable"></td>
      <td colspan="2" style="text-align:right; padding-right:8px;">稅金 (5%)</td>
      <td><input class="editable" id="tax" type="number" step="any" oninput="calc()" value="0" style="text-align:center; font-weight:bold;"></td>
      <td></td>
    </tr>
    <tr class="subtotal-row">
      <td><input class="editable"></td>
      <td><input class="editable"></td>
      <td><input class="editable"></td>
      <td colspan="2" style="text-align:right; padding-right:8px;">合計</td>
      <td id="total">0</td>
      <td></td>
    </tr>
  </table>

  <div class="total-words">
    <span>總額 新台幣 <span id="totalChinese">零</span> 元整</span>
    <span id="totalNumber">0</span>
  </div>

  <div class="footer-notes">
    <div class="left">
      1. 本估價單有效期間　<input class="editable" id="validYear" style="width:30px; text-align:center; border-bottom:1px solid #000;"> 年　<input class="editable" id="validMonth" style="width:30px; text-align:center; border-bottom:1px solid #000;"> 月<br>
      2. 如蒙惠顧請先支付定金　<input class="editable" id="depositPercent" style="width:30px; text-align:center; border-bottom:1px solid #000;"> 成
    </div>
    <div class="right">經手人：陳智偉</div>
  </div>
</div>

<script>
let rowCount = 0;

function addRow() {
  rowCount++;
  const tbody = document.getElementById('itemsBody');
  const tr = document.createElement('tr');
  tr.innerHTML = `
    <td>${rowCount}</td>
    <td class="col-spec"><input class="editable" data-field="spec"></td>
    <td><input class="editable" data-field="qty" type="number" step="any" oninput="calc()"></td>
    <td><input class="editable" data-field="unit"></td>
    <td><input class="editable" data-field="price" type="number" step="any" oninput="calc()"></td>
    <td class="amount">0</td>
    <td><input class="editable" data-field="note"></td>
  `;
  tbody.appendChild(tr);
  calc();
}

function calc() {
  let subtotal = 0;
  document.querySelectorAll('#itemsBody tr').forEach(tr => {
    const qty = parseFloat(tr.querySelector('[data-field="qty"]')?.value) || 0;
    const price = parseFloat(tr.querySelector('[data-field="price"]')?.value) || 0;
    const amount = qty * price;
    const amountCell = tr.querySelector('.amount');
    if (amountCell) amountCell.textContent = amount ? amount.toLocaleString() : '0';
    subtotal += amount;
  });
  const tax = parseFloat(document.getElementById('tax').value) || 0;
  const total = subtotal + tax;
  document.getElementById('subtotal').textContent = subtotal.toLocaleString();
  document.getElementById('total').textContent = total.toLocaleString();
  document.getElementById('totalNumber').textContent = total.toLocaleString();
  document.getElementById('totalChinese').textContent = toChineseNumber(total);
}

function toChineseNumber(num) {
  if (num === 0) return '零';
  const digits = '零壹貳參肆伍陸柒捌玖';
  const units = ['', '拾', '佰', '仟', '萬', '拾萬', '佰萬', '仟萬', '億'];
  let str = '';
  const s = Math.floor(num).toString();
  for (let i = 0; i < s.length; i++) {
    const d = parseInt(s[i]);
    const u = units[s.length - 1 - i];
    if (d !== 0) str += digits[d] + u;
    else if (!str.endsWith('零') && i < s.length - 1) str += '零';
  }
  return str.replace(/零+$/, '').replace(/零+/g, '零') || '零';
}

function downloadPDF() {
  alert('請使用「輸出 / 列印」按鈕，在列印對話框選擇「另存為 PDF」。');
  window.print();
}

// 初始產生 10 列空白項目
for (let i = 0; i < 10; i++) addRow();

const today = new Date();
document.getElementById('year').value = today.getFullYear() - 1911;
document.getElementById('month').value = today.getMonth() + 1;
document.getElementById('day').value = today.getDate();
</script>
</body>
</html>
